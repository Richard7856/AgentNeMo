# Milvus vector database stack for insurance-claims-agent.
#
# WHY 3 containers (not just Milvus):
# Milvus Standalone requires etcd (distributed config/metadata store) and
# MinIO (object storage for index segments). These aren't optional — Milvus
# will refuse to start without them. This is the standard production-grade
# Milvus standalone setup from the official docs.
#
# Usage:
#   make infra-up    → start stack (detached)
#   make infra-down  → stop and remove containers (data preserved in volumes)
#   make infra-reset → stop + remove volumes (full wipe, useful for dev)

services:

  etcd:
    # etcd stores Milvus cluster metadata and coordinates distributed state.
    # Even in standalone mode, Milvus uses it to track collection schemas,
    # segment assignments, and index build status.
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296   # 4 GB quota
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus

  minio:
    # MinIO is S3-compatible object storage used by Milvus to persist vector
    # index segment files. Without it, Milvus can't save indexes between restarts.
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus

  milvus:
    # Milvus Standalone — single-node vector database.
    # Listens on port 19530 (gRPC, used by the Python SDK) and 9091 (HTTP metrics).
    # Connection string in tools: "http://localhost:19530"
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC — Python SDK connects here
      - "9091:9091"     # HTTP metrics endpoint
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s    # Milvus takes ~60s to initialize on first run
    networks:
      - milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  milvus:
    driver: bridge
